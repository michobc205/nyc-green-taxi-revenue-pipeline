[project]
name = "nyc-green-taxi-revenue-pipeline"
version = "0.1.0"
requires-python = ">=3.13.17"
dependencies = [
    "click>=8.5.0",
    "duckdb>=2.0.0",
    "pandas>=3.0.5",
    "polars>=2.1.0",
    "prefect>=3.8.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
]

[tool.ty.environment]
root = ["."]

[tool.uv]
required-version = ">=0.13.5"
# Apply certificate fixes without adding unused runtime packages.
# Prefect's server still uses FastAPI's removed min_items argument.
constraint-dependencies = ["certifi>=2026.10.19", "pip>=26.2.2", "fastapi<0.155"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_revenue"]

[project.scripts]
taxi-revenue = "taxi_revenue.cli:main"
